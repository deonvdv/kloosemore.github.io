function getRadius(count) {
  if (count >= 100) return 32;
  if (count >= 50) return 24;
  if (count >= 20) return 18;
  if (count >= 10) return 14;
  if (count >= 5) return 10;
  if (count >= 2) return 7;
  return 5;
}

function getColor(count) {
  if (count >= 50) return '#A32D2D';
  if (count >= 20) return '#D85A30';
  if (count >= 10) return '#EF9F27';
  if (count >= 5) return '#BA7517';
  return '#D85A30';
}

window.addEventListener('load', function() {
  const map = L.map('map', {
    center: [42.5, -2.0],
    zoom: 6,
    zoomControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  const tooltip = document.getElementById('tooltip');
  const ttName = document.getElementById('tt-name');
  const ttCount = document.getElementById('tt-count');

  incidents.forEach(function(d) {
    const circle = L.circleMarker([d.lat, d.lng], {
      radius: getRadius(d.count),
      fillColor: getColor(d.count),
      color: '#fff',
      weight: 1,
      opacity: 0.9,
      fillOpacity: 0.75
    }).addTo(map);

    circle.on('mouseover', function(e) {
      tooltip.style.display = 'block';
      ttName.textContent = d.name;
      ttCount.textContent = d.count + (d.count === 1 ? ' incident' : ' incidents');
      tooltip.style.left = (e.originalEvent.clientX + 12) + 'px';
      tooltip.style.top = (e.originalEvent.clientY - 10) + 'px';
    });
    circle.on('mousemove', function(e) {
      tooltip.style.left = (e.originalEvent.clientX + 12) + 'px';
      tooltip.style.top = (e.originalEvent.clientY - 10) + 'px';
    });
    circle.on('mouseout', function() {
      tooltip.style.display = 'none';
    });
  });
});
</script>
