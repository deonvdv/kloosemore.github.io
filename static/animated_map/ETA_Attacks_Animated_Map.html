// Map

  attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

// State
let markers={}, locsHit=new Set(), yrCount=0, curYear=MIN_YEAR;

function getRadius(n){return Math.min(3+Math.sqrt(n)*3.8,30)}

function filterEvents(c){
  if(c==='all') return EVENTS.slice();
  return EVENTS.filter(e=>e[c]>0);
}

function clearAll(){
  Object.values(markers).forEach(m=>map.removeLayer(m.circle));
  markers={}; locsHit=new Set(); yrCount=0; curYear=MIN_YEAR;
}

function applyOne(e, silent){
  const key=e.loc;
  const val=(cat==='all')?1:e[cat];
  if(!markers[key]){
    const circle=L.circleMarker([e.lat,e.lon],{
      radius:getRadius(1),
      fillColor:COLORS[cat].fill,
      color:'rgba(0,0,0,0.4)',weight:0.8,
      fillOpacity:0.85
    }).addTo(map);
    const label=(cat==='all')?'attack':(cat==='m'?'murder':cat==='k'?'kidnapping':'injury');
    circle.bindTooltip('',{permanent:false,direction:'top',className:'leaflet-tooltip'});
    markers[key]={circle,count:0,label};
  }
  markers[key].count+=val;
  const c=markers[key].count;
  markers[key].circle.setRadius(getRadius(c));
  markers[key].circle.setStyle({fillColor:COLORS[cat].fill});
  markers[key].circle.setTooltipContent(
    '<b>'+key+'</b><br>'+c+' '+markers[key].label+(c!==1?'s':'')
  );
  locsHit.add(key);
  if(!silent){
    if(e.y!==curYear){yrCount=0;curYear=e.y;}
    yrCount++;
    refreshUI(e.y,e.mo);
  }
}

function refreshUI(year,month){
  document.getElementById('date-display').textContent=MONTHS[month-1]+' '+year;
  document.getElementById('s-total').textContent=idx+1;
  document.getElementById('s-year').textContent=yrCount;
  document.getElementById('s-locs').textContent=locsHit.size;
  const pct=catEvents.length>1?(idx/(catEvents.length-1))*100:100;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-handle').style.left=pct+'%';
  document.getElementById('scrubber').value=catEvents.length>1?idx/(catEvents.length-1):1;
  drawTimeline(year);
}

function rewindTo(target){
  clearAll(); idx=0; yrCount=0; curYear=MIN_YEAR;
  for(let i=0;i<target;i++) applyOne(catEvents[i],true);
  idx=target;
  if(target<catEvents.length){
    const e=catEvents[target];
    if(e.y!==curYear){yrCount=0;curYear=e.y;}
    yrCount++;
    refreshUI(e.y,e.mo);
  }
}

const canvas=document.getElementById('bar-canvas');
const ctx=canvas.getContext('2d');
function drawTimeline(hiYear){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.offsetWidth, h=canvas.offsetHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const yc=YEAR_COUNTS[cat];
  const maxV=Math.max(1,...Object.values(yc));
  const bw=w/TOTAL_YEARS, bMaxH=h-14;
  for(let y=MIN_YEAR;y<=MAX_YEAR;y++){
    const cnt=yc[y]||0;
    const bh=cnt>0?Math.max(2,(cnt/maxV)*bMaxH):1;
    const x=(y-MIN_YEAR)*bw;
    ctx.fillStyle=y===hiYear?COLORS[cat].fill:(cnt>0?COLORS[cat].bar+'88':'#1e293b');
    ctx.fillRect(x+0.5,h-bh-13,bw-1,bh);
    if((y-MIN_YEAR)%5===0){
      ctx.fillStyle='#4b5563'; ctx.font='9px Arial'; ctx.textAlign='center';
      ctx.fillText(y,x+bw/2,h-2);
    }
  }
}

function setTheme(){
  const col=COLORS[cat];
  document.getElementById('play-btn').style.background=col.btn;
  document.getElementById('progress-fill').style.background=col.bar;
  document.getElementById('progress-handle').style.background=col.bar;
  document.getElementById('date-display').style.color=col.fill;
}

// Animation
function tick(ts){
  if(!playing) return;
  if(!lastTs) lastTs=ts;
  const dt=ts-lastTs; lastTs=ts;
  accumMs+=dt*speed;
  while(accumMs>=BASE_MS && idx<catEvents.length-1){
    accumMs-=BASE_MS; idx++;
    applyOne(catEvents[idx],false);
  }
  if(idx>=catEvents.length-1){
    playing=false;
    document.getElementById('play-btn').textContent='↺ Restart';
    return;
  }
  animFrame=requestAnimationFrame(tick);
}
function stopAnim(){
  playing=false;
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
}

// Controls
document.getElementById('play-btn').addEventListener('click',()=>{
  if(!playing){
    if(idx>=catEvents.length-1){clearAll();idx=0;}
    playing=true; lastTs=null; accumMs=0;
    document.getElementById('play-btn').textContent='⏸ Pause';
    animFrame=requestAnimationFrame(tick);
  } else {
    stopAnim();
    document.getElementById('play-btn').textContent='▶ Play';
  }
});

document.getElementById('scrubber').addEventListener('input',function(){
  const was=playing; stopAnim();
  rewindTo(Math.round(parseFloat(this.value)*(catEvents.length-1)));
  if(was){
    playing=true; lastTs=null; accumMs=0;
    document.getElementById('play-btn').textContent='⏸ Pause';
    animFrame=requestAnimationFrame(tick);
  }
});

document.getElementById('speed').addEventListener('input',function(){
  speed=parseInt(this.value);
  document.getElementById('speed-val').textContent=speed+'×';
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',function(){
    if(this.dataset.cat===cat) return;
    stopAnim();
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    cat=this.dataset.cat;
    catEvents=filterEvents(cat);
    clearAll(); idx=0;
    document.getElementById('play-btn').textContent='▶ Play';
    document.getElementById('progress-fill').style.width='0%';
    document.getElementById('progress-handle').style.left='0%';
    document.getElementById('scrubber').value=0;
    document.getElementById('date-display').textContent='1961';
    document.getElementById('s-total').textContent=0;
    document.getElementById('s-year').textContent=0;
    document.getElementById('s-locs').textContent=0;
    setTheme();
    drawTimeline(MIN_YEAR);
  });
});

// Init
setTheme();
drawTimeline(MIN_YEAR);
document.getElementById('date-display').textContent='1961';
</script>
</body>
</html>
